services:
  karyalokal:
    build:
      context: .
      args:
        NEXT_PUBLIC_WA_NUMBER: ${NEXT_PUBLIC_WA_NUMBER}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    container_name: karyalokal
    restart: unless-stopped
    environment:
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      LEAD_TO_EMAIL: ${LEAD_TO_EMAIL:-}
      LEAD_FROM_EMAIL: ${LEAD_FROM_EMAIL:-}
    volumes:
      - ./data:/app/data          # leads.jsonl tersimpan di host
    ports:
      - "127.0.0.1:3000:3000"   # hanya bisa diakses Nginx di host
