# /etc/nginx/sites-available/karyalokal, lalu symlink ke sites-enabled.
# Ganti karyalokal.com dengan domain Anda.
# Sertifikat dulu: sudo certbot certonly --nginx -d karyalokal.com -d www.karyalokal.com

server {
    listen 80;
    listen [::]:80;
    server_name karyalokal.com www.karyalokal.com;
    return 301 https://karyalokal.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.karyalokal.com;
    ssl_certificate     /etc/letsencrypt/live/karyalokal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karyalokal.com/privkey.pem;
    return 301 https://karyalokal.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name karyalokal.com;

    ssl_certificate     /etc/letsencrypt/live/karyalokal.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/karyalokal.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    client_max_body_size 5m;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
